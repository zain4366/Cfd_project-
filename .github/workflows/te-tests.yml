name: te-tests
# Extra-fine rigid mesh (h 0.0133, 237 points per side) diverges even with the laplacian limiter.
# Round 2b: potentialFoam needs div(div(phi,U)); rerun.
# Round 2: layout changes did not help (all diverge at ~80 steps, as did a static foil) -> potentialFoam start.
# Short tests of trailing-edge layout changes (block angle, surface point clustering, smoothing).
# (Older note:) Fine rigid mesh diverges after ~80 steps (any step size, serial or parallel; checkMesh -allGeometry passes).
# Short runs (0.6 cycle at T/2000), each changing one thing, to find what cures it.
on:
  push:
    branches: [main]
    paths: [".github/workflows/te-tests.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: f_pot_nolim,   pot: "1" }
          - { name: x_pot_lim,     meshset: "h=0.0133,ns=237,nte=9,a=0.00087", pot: "1", lapl: "limited corrected 0.33" }
          - { name: x_pot_nolim,   meshset: "h=0.0133,ns=237,nte=9,a=0.00087", pot: "1" }
          - { name: m_pot_nolim,   level: medium, pot: "1" }
    env: { OF_VERSION: "2412", GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", OUT: "out/${{ matrix.name }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash scripts/install.sh > install.log 2>&1 || { tail -50 install.log; exit 1; }
      - name: Build fine rigid mesh
        env: { NTE: "${{ matrix.nte }}", RAMP: "${{ matrix.ramp }}", MESHSET: "${{ matrix.meshset }}" }
        run: mkdir -p $OUT && bash scripts/build_rigid.sh ${{ matrix.level || 'fine' }} run/rigid $OUT 20 > $OUT/step_build.log 2>&1 && grep -E "cells:|Mesh OK|non-orthogonality Max" $OUT/log.checkMesh
      - name: Set up 0.6 cycle at T/2000
        env: { DDT: "${{ matrix.ddt }}", DIVU: "${{ matrix.divu }}", LAPL: "${{ matrix.lapl }}", STATIC: "${{ matrix.static }}", POTENTIAL: "${{ matrix.pot }}" }
        run: bash scripts/setup_rigid.sh run/rigid 0.6 2000 2>&1 | tee $OUT/step_setup.log
      - name: Run
        run: bash scripts/run_solver.sh run/rigid $OUT 60 tetests/${{ matrix.name }} 2>&1 | tee $OUT/step_run.log
      - name: Summary
        if: always()
        run: |
          source scripts/openfoam_env.sh
          python3 scripts/post_forces.py run/rigid $OUT --log run/rigid/log.solver > /dev/null 2>&1 || true
          grep -E "^Courant" run/rigid/log.solver | awk '{print $NF}' | python3 -c "import sys; v=[float(x) for x in sys.stdin]; print(f'steps {len(v)}, max Courant {max(v):.3g}, last {v[-1]:.3g}')" | tee $OUT/test_result.txt
          cat $OUT/solver_exit.txt >> $OUT/test_result.txt
          grep -E "^Courant" run/rigid/log.solver | awk 'NR%50==0{print NR, $NF}' > $OUT/courant_every50.txt
          head -150 run/rigid/log.solver > $OUT/log_head.txt; grep -E "^Courant|^Time =" run/rigid/log.solver | head -60 > $OUT/courant_first.txt
          grep -B5 -A25 "FOAM FATAL" run/rigid/log.solver > $OUT/fatal.txt || true
      - name: Publish
        if: always()
        run: bash scripts/publish_results.sh $OUT tetests/${{ matrix.name }} "numerics test ${{ matrix.name }} for ${GITHUB_SHA::7}"
